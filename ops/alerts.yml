groups:
  - name: devconnect
    rules:
      - alert: DevConnectUnavailable
        expr: up{job="devconnect"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: DevConnect não responde à coleta de métricas
      - alert: DevConnectHighErrorRate
        expr: sum(rate(devconnect_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(devconnect_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Mais de 5% das requisições retornam erro de servidor
