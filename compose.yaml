services:
  app:
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_PASSWORD: ${MONGO_PASSWORD:?Configure MONGO_PASSWORD no .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 12
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: social_network
      POSTGRES_USER: devconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/social_network.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U devconnect -d social_network"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: devconnect
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Configure MONGO_PASSWORD no .env}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/01-chat.js:ro
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
  mongo_data:
